[package]
autobins = false
name = "lipi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
lipi-core = { version = "0.1.0", path = "../lipi-core" }
lipi-engine = { version = "0.1.0", path = "../lipi-engine" }
lipi-script = { version = "0.1.0", path = "../lipi-script" }
lipi-sys = { version = "0.1.0", path = "../lipi-sys" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "lipi"
path = "src/main.rs"
